<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 个案分析</title>
  <link rel="stylesheet" href="css/aichat.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="app">

  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">AI</div>
      <h1>AI 数据库个案分析</h1>
    </div>

    <div class="upload-card">
      <div id="dropzone" class="dropzone">
        <p>拖拽个案文件到此，或点击选择</p>
        <input id="fileInput" type="file" multiple hidden />
        <button id="chooseBtn" class="btn">选择文件</button>
      </div>
      <div id="filesList" class="files-list"></div>
    </div>

    <div style="margin-top:auto;display:flex;justify-content:space-between">
      <button class="btn" onclick="toggleTheme()">主题切换</button>
      <button id="clearBtn" class="btn">清空</button>
    </div>
  </aside>

  <!-- 聊天区 -->
  <section class="chat">
    <div id="messages" class="messages"></div>

    <div class="input-row">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button id="sendBtn" class="btn">发送</button>
        <button id="attachBtn" class="btn">上传并分析</button>
      </div>
    </div>
  </section>

</div>

<script src="js/aichat.js"></script>
</body>
</html>
