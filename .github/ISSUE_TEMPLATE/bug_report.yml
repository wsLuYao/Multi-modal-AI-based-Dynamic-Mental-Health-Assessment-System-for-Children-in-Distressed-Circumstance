name: Bug report / 缺陷报告
description: Report a reproducible software defect using synthetic data only.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include real case files, personal data, credentials, or sensitive screenshots. / 请勿附带真实个案、个人信息、凭据或敏感截图。"
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic data
      description: Provide minimal steps and a fully synthetic example.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12, commit SHA
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this issue contains no real-person or confidential data.
          required: true
