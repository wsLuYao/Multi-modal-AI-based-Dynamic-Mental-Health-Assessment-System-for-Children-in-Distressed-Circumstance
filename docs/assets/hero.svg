<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Phoenix Butterfly research prototype</title>
  <desc id="desc">Explainable text signals with human judgement first.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#062d31"/><stop offset=".62" stop-color="#075b59"/><stop offset="1" stop-color="#0d8479"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#74d7c7" stop-opacity=".55"/><stop offset="1" stop-color="#74d7c7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#b7eee5" stroke-opacity=".07"/></pattern>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#001c1d" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>
  <circle cx="1040" cy="90" r="300" fill="url(#glow)"/>
  <g transform="translate(70 62)">
    <g transform="translate(0 0)">
      <rect width="58" height="58" rx="18" fill="#8be0d2"/>
      <path d="M29 28C20 9 6 11 8 24c1 8 9 11 19 8-8 6-12 13-8 18 5 5 10-6 10-17 0 11 5 22 10 17 4-5 0-12-8-18 10 3 18 0 19-8 2-13-12-15-21 4Z" fill="#063b3d" transform="scale(.72) translate(11 7)"/>
    </g>
    <text x="78" y="24" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="2.5" fill="#d9f5f0">PHOENIX BUTTERFLY</text>
    <text x="78" y="48" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" fill="#8ec6c1">凤蝶之心 · 文本信号研究原型</text>
  </g>
  <g transform="translate(70 167)">
    <text font-family="Inter,Segoe UI,sans-serif" font-size="47" font-weight="750" letter-spacing="-1.5" fill="#ffffff">Explainable text signals.</text>
    <text y="57" font-family="Inter,Segoe UI,sans-serif" font-size="47" font-weight="750" letter-spacing="-1.5" fill="#8be0d2">Human judgement first.</text>
    <text y="105" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="16" fill="#b5d8d4">隐私优先 · 透明规则 · 合成数据 · 专业人员最终复核</text>
  </g>
  <g transform="translate(795 125)" filter="url(#shadow)">
    <rect width="330" height="225" rx="22" fill="#ffffff" fill-opacity=".96"/>
    <text x="25" y="34" font-family="Inter,Segoe UI,sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" fill="#688384">KEYWORD COVERAGE · DEMO</text>
    <g font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="11" fill="#39585b">
      <text x="25" y="73">监护支持不足</text><rect x="25" y="83" width="280" height="7" rx="4" fill="#e4eeed"/><rect x="25" y="83" width="196" height="7" rx="4" fill="#16877d"/>
      <text x="25" y="119">家庭功能压力</text><rect x="25" y="129" width="280" height="7" rx="4" fill="#e4eeed"/><rect x="25" y="129" width="126" height="7" rx="4" fill="#4eaaa2"/>
      <text x="25" y="165">经济生活压力</text><rect x="25" y="175" width="280" height="7" rx="4" fill="#e4eeed"/><rect x="25" y="175" width="70" height="7" rx="4" fill="#83c6bf"/>
    </g>
    <rect x="25" y="198" width="134" height="18" rx="9" fill="#e3f4f1"/>
    <text x="35" y="211" font-family="Inter,Segoe UI,sans-serif" font-size="8" font-weight="700" letter-spacing=".6" fill="#14746d">SYNTHETIC DATA ONLY</text>
  </g>
