[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-butterfly-assessment"
version = "0.1.1"
description = "A privacy-conscious, explainable text-signal baseline for research demonstrations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Phoenix Butterfly contributors" }]
keywords = ["responsible-ai", "mental-health", "child-welfare", "text-analysis", "pywebview"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["python-docx>=1.1,<2"]

[project.optional-dependencies]
desktop = ["pywebview>=5,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
phoenix-assessment = "phoenix_assessment.desktop:main"

[project.urls]
Homepage = "https://github.com/wsLuYao/Multi-modal-AI-based-Dynamic-Mental-Health-Assessment-System-for-Children-in-Distressed-Circumstance"
Issues = "https://github.com/wsLuYao/Multi-modal-AI-based-Dynamic-Mental-Health-Assessment-System-for-Children-in-Distressed-Circumstance/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phoenix_assessment = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001"] # Chinese punctuation and full-width Unicode are intentional.
